<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles.css" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Password generator app</title>
  </head>
  <body>
    <section class="card">
      <h1 class="title">Password Generator</h1>
      <div class="password-section">
        <h2 class="password-text" id="password-display">P4$5W0rD!</h2>
        <div class="copy-field">
          <h3 class="non-display" id="copy-text">Copied</h3>
          <button class="copy" data-copy=".password-text-generated" id="copy">
            <svg width="21" height="24" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M20.341 3.091 17.909.659A2.25 2.25 0 0 0 16.319 0H8.25A2.25 2.25 0 0 0 6 2.25V4.5H2.25A2.25 2.25 0 0 0 0 6.75v15A2.25 2.25 0 0 0 2.25 24h10.5A2.25 2.25 0 0 0 15 21.75V19.5h3.75A2.25 2.25 0 0 0 21 17.25V4.682a2.25 2.25 0 0 0-.659-1.591ZM12.469 21.75H2.53a.281.281 0 0 1-.281-.281V7.03a.281.281 0 0 1 .281-.281H6v10.5a2.25 2.25 0 0 0 2.25 2.25h4.5v1.969a.282.282 0 0 1-.281.281Zm6-4.5H8.53a.281.281 0 0 1-.281-.281V2.53a.281.281 0 0 1 .281-.281H13.5v4.125c0 .621.504 1.125 1.125 1.125h4.125v9.469a.282.282 0 0 1-.281.281Zm.281-12h-3v-3h.451c.075 0 .147.03.2.082L18.667 4.6a.283.283 0 0 1 .082.199v.451Z"
                fill="currentColor"
              />
            </svg>
          </button>
        </div>
      </div>
      <div class="password-generations-section">
        <div class="length-field">
          <div class="character-length-row">
            <p class="character-length">Character Length</p>
            <div class="character-length-nr" id="nr-password-char"></div>
          </div>
          <div class="slide-container">
            <input
              type="range"
              min="1"
              max="16"
              value="8"
              class="slider"
              id="passwordRange"
            />
          </div>
        </div>
        <form class="form">
          <div class="checkbox-row">
            <input type="checkbox" name="uppercase" id="uppercase" />
            <label for="uppercase">Include Uppercase Letters</label>
          </div>
          <div class="checkbox-row">
            <input type="checkbox" name="lowercase" id="lowercase" />
            <label for="lowercase">Include Lowercase Letters</label>
          </div>
          <div class="checkbox-row">
            <input type="checkbox" name="numbers" id="numbers" />
            <label for="numbers">Include Numbers</label>
          </div>
          <div class="checkbox-row">
            <input type="checkbox" name="symbols" id="symbols" />
            <label for="symbols">Include Symbols</label>
          </div>
        </form>
        <div class="strength-check">
          <h3 class="strength-check__text">Strength</h3>
          <div class="strength-check__eval">
            <div class="strength-check__eval-text">Medium</div>
            <div class="strength-bars">
              <div class="strength-bar-yellow bar1"></div>
              <div class="strength-bar-yellow bar2"></div>
              <div class="strength-bar-yellow bar3"></div>
              <div class="strength-bar bar4"></div>
            </div>
          </div>
        </div>
        <button class="btn" id="btn">
          Generate
          <svg width="12" height="12" xmlns="http://www.w3.org/2000/svg">
            <path
              fill="currentColor"
              d="m5.106 12 6-6-6-6-1.265 1.265 3.841 3.84H.001v1.79h7.681l-3.841 3.84z"
            />
          </svg>
        </button>
      </div>
    </section>
  </body>
  <script src="./main.js"></script>
</html>
